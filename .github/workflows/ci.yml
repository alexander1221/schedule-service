# CI: линтер, типы, тесты ядра и веба на Linux и Windows; веб-тесты отдельно на PostgreSQL.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked, hashes)
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .
      - name: Mypy (core)
        run: python -m mypy
      - name: PowerShell scripts are pure ASCII
        if: runner.os == 'Linux'
        run: "! grep -P '[^\\x00-\\x7F]' setup.ps1 windows_first_run.bat"
      - name: PowerShell parses setup.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: "[scriptblock]::Create((Get-Content -Raw setup.ps1)) | Out-Null"
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (SQLite)
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Failed tests → annotations
        if: failure()
        run: python .github/ci_annotate.py pytest-report.xml
      - name: Slow tests (solver on college-scale synthetic)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pytest -q --slow -k synthetic
      - name: verify_install
        run: |
          python manage.py migrate --noinput
          python verify_install.py

  # Интерфейс диспетчера (React + TypeScript): типы, тесты, сборка — тем же npm, что идёт с Node 22
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # MCP-сервер агента диспетчера на обеих версиях библиотеки mcp (код один — mcp_server/compat.py)
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: [v1, v2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mcp (${{ matrix.sdk }}, locked, hashes)
        run: python -m pip install --require-hashes -r requirements-mcp-${{ matrix.sdk }}-lock.txt
      - run: python -m pip install pytest==9.1.1
      - name: MCP protocol over stdio
        run: python -m pytest -q tests_mcp -p no:cacheprovider

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schedule
          POSTGRES_PASSWORD: schedule
          POSTGRES_DB: schedule
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schedule" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_HOST: 127.0.0.1
      DB_PASSWORD: schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pytest -q tests_web --junitxml=pytest-report.xml
      - name: Failed tests → annotations
        if: failure()
        run: python .github/ci_annotate.py pytest-report.xml
