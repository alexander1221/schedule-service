{% extends "admin/change_list.html" %}
{% block object-tools-items %}
  <li><a href="{{ mass_url }}{% if request.GET.semester__id__exact %}?semester={{ request.GET.semester__id__exact }}{% endif %}">Массовое создание</a></li>
  {% for title, url in semester_tools %}<li><a href="{{ url }}">{{ title }}</a></li>{% endfor %}
  {% if not semester_tools %}<li><a href="#" onclick="return false" title="Выберите семестр в фильтре справа">Импорт/экспорт: выберите семестр →</a></li>{% endif %}
  {{ block.super }}
{% endblock %}
