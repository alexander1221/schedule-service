{% extends "portal/base.html" %}
{% block title %}Код — Расписание{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <h1>Введите код</h1>
  <p class="muted">Если адрес <b>{{ email }}</b> есть в списке, на него отправлен код. Он действует {{ minutes }} минут.</p>
  <form method="post">{% csrf_token %}
    <label for="code">Код из письма</label>
    <p><input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus></p>
    <button type="submit">Войти</button>
  </form>
  <p style="margin-top:12px"><a href="{% url 'login' %}">Другой адрес или новый код</a></p>
</div>
{% endblock %}
